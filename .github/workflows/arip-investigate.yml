name: ARIP investigate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync arip-core deps
        working-directory: arip-core
        run: uv sync --extra dev

      - name: Install Playwright deps
        working-directory: tests/playwright
        run: npm ci || npm install

      - name: Bring up demo stack
        run: docker compose up -d --wait

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null \
              && curl -sf http://localhost:8081/healthz >/dev/null \
              && exit 0
            sleep 1
          done
          echo "services never became healthy" >&2
          docker compose logs --tail=200
          exit 1

      - name: Run Playwright (failures expected)
        working-directory: tests/playwright
        run: |
          rm -f playwright-report.json
          npx playwright test || true
          test -s playwright-report.json

      - name: Cache ARIP memory across runs
        uses: actions/cache@v4
        with:
          path: .arip
          key: arip-memory-${{ github.repository }}
          restore-keys: |
            arip-memory-

      - name: Wait briefly for trace flush
        run: sleep 5

      - name: Run ARIP investigation
        working-directory: arip-core
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run arip investigate \
            ../tests/playwright/playwright-report.json \
            --out ../reports \
            --memory ../.arip/memory.db \
            --environment "ci"

      - name: Render PR comment
        if: always()
        working-directory: arip-core
        run: |
          uv run arip pr-comment ../reports --out ../arip-pr-comment.md
          cat ../arip-pr-comment.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: arip-pr-comment.md
          header: arip-investigation

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arip-reports
          path: |
            reports/
            tests/playwright/playwright-report.json
            arip-pr-comment.md
          retention-days: 14

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --tail=300
