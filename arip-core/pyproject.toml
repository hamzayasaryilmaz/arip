[project]
name = "arip-core"
version = "0.1.0"
description = "Autonomous Reliability Investigation Platform — collector, correlator, engine, reporter."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "Hamza Yasar Yilmaz", email = "hamzayasaryilmaz@gmail.com"},
]
keywords = ["observability", "opentelemetry", "ci", "investigation", "playwright", "cypress"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
arip = "arip_core.cli:main"

[project.urls]
Homepage = "https://github.com/hamzayasaryilmaz/arip"
Repository = "https://github.com/hamzayasaryilmaz/arip"
Issues = "https://github.com/hamzayasaryilmaz/arip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arip_core"]

# ─── Tooling configuration ─────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # Anthropic SDK and httpx occasionally emit deprecation warnings on
    # patch releases; don't fail the suite on those.
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names, dead code) — these
# are real defects, always enforced.
# E,W = pycodestyle (style)
# I = isort (import ordering)
# B = bugbear (likely bugs)
# UP = pyupgrade (use modern Python idioms)
# SIM = simplify (clear style)
# RUF = ruff-specific (catches edge cases)
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length; line-length already set, don't double-enforce on existing tests
    "B008",   # function call in default arg — false-positive on dataclass field defaults
    "SIM108", # ternary preference is stylistic
    # Ambiguous-unicode warnings (RUF001/002/003) — we intentionally use
    # ×, ∪, ℹ in docstrings/output for readability (e.g. "5× amplification").
    # These are deliberate; the warnings just create noise.
    "RUF001",
    "RUF002",
    "RUF003",
    "E741",   # ambiguous variable name `l` in helpers — fine in short locals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E741",  # ambiguous variable names — fine in tests (e for evidence, etc.)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["arip_core"]
omit = [
    "*/tests/*",
    # The LLM summariser hits the network; not unit-tested by design.
    "*/reporter/llm_summarizer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
