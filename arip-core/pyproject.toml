[project]
name = "arip-core"
version = "0.1.0"
description = "Autonomous Reliability Investigation Platform — collector, correlator, engine, reporter."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
arip = "arip_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arip_core"]
